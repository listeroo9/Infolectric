{% extends 'core/base.html' %}

{% block content %}
<div class="container py-4">
  <div class="d-flex justify-content-between align-items-start flex-wrap gap-2 mb-3">
    <div>
      <h1 class="h3 mb-0">{% if form.instance.pk %}Edit Appliance{% else %}Add Appliance{% endif %}</h1>
      <div class="small text-muted">Appliance form</div>
    </div>
  </div>
    <div>
      <a href="{% url 'core:appliance-list' %}" class="glass-btn">Back to Appliances</a>
    </div>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}

    {% if not user.is_staff and not user.is_superuser %}
      <div class="mb-3">
        <label for="reason" class="form-label">
          Reason for {% if form.instance.pk %}requested change{% else %}request{% endif %}
          <span class="text-danger">*</span>
        </label>
        <textarea id="reason" name="reason" class="form-control" rows="3">{{ request.POST.reason }}</textarea>
      </div>
    {% endif %}

    <button class="btn btn-primary">Save</button>
  </form>
</div>
{% endblock %}
